<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Çalışma Kâğıtları | Hipotenüs</title>
<link rel="canonical" href="https://hipotenusmatematik.com/calisma-kagitlari.html">
<meta name="description" content="Hipotenüs Yolculuğu çalışma kâğıtları: Maarif Modeli temalarına uygun, yazdırılabilir matematik etkinlik kâğıtları (PDF).">
<meta name="theme-color" content="#2E9E78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="games.css">
</head>
<body>

<header class="site-header">
  <div class="bar">
    <a href="index.html" class="logo" aria-label="Hipotenüs ana sayfa">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <polygon points="6,42 6,8 42,42" fill="#9EE6C9" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
        <line x1="6" y1="8" x2="42" y2="42" stroke="#FFD84D" stroke-width="4" stroke-linecap="round"/>
        <rect x="6" y="34" width="8" height="8" fill="none" stroke="#fff" stroke-width="2"/>
      </svg>
      <span>Hipoten<b>ü</b>s</span>
    </a>
    <div class="bar-actions">
      <a class="btn-login btn-ghost" href="index.html"><span aria-hidden="true">🏠</span><span class="lbl">Ana Sayfa</span></a>
      <div id="userArea"></div>
    </div>
  </div>
</header>

<main class="wrap" style="padding-bottom:48px">
  <div class="page-head">
    <div><h1>Çalışma Kâğıtları</h1><p>Yazdırılabilir Hipotenüs Yolculuğu etkinlik kâğıtları. PDF’i aç, yazdır, sınıfta kullan.</p></div>
  </div>
  <div class="filters" role="group" aria-label="Sınıf">
    <button class="chip" data-grade="" aria-pressed="true">Tüm sınıflar</button>
    <button class="chip" data-grade="5" aria-pressed="false">5. Sınıf</button>
    <button class="chip" data-grade="6" aria-pressed="false">6. Sınıf</button>
    <button class="chip" data-grade="7" aria-pressed="false">7. Sınıf</button>
    <button class="chip" data-grade="8" aria-pressed="false">8. Sınıf</button>
  </div>
  <div class="grid ws-grid" id="list" aria-live="polite"></div>
</main>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="games.js"></script>
<script>
(function () {
  initPage();
  const params = new URLSearchParams(location.search);
  let grade = params.get('sinif') || '';
  const card = w => `<article class="card ws-card ${w.color}">
      <a class="ws-thumb" href="${w.pdf}" target="_blank" rel="noopener"><img src="${w.thumb}" alt="${esc(w.title)} kâğıdının ilk sayfası" loading="lazy" width="397" height="562"></a>
      <div class="ws-body">
        <div class="act-top"><span class="act-type">📝 Çalışma Kâğıdı</span><span class="sinif-kose"><b>${w.grade}.</b>Sınıf</span></div>
        <h3>${esc(w.title)}</h3>
        <p>${esc(w.text)}</p>
        <div class="act-meta"><span class="tag">${esc(w.unit)}</span><span class="tag">${w.info}</span></div>
        <div class="ws-btns">
          <a class="btn btn-yellow" href="${w.pdf}" target="_blank" rel="noopener">📄 Aç ve Yazdır</a>
          <a class="btn btn-ghost-dark" href="${w.pdf}" download>⬇ İndir</a>
        </div>
      </div>
    </article>`;
  function render() {
    document.querySelectorAll('[data-grade]').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.grade === grade)));
    try { history.replaceState(null, '', grade ? `?sinif=${grade}` : location.pathname); } catch {}
    const list = WORKSHEETS.filter(w => !grade || w.grade === Number(grade));
    document.getElementById('list').innerHTML = list.length ? list.map(card).join('')
      : '<div class="empty"><b>Bu sınıf için henüz çalışma kâğıdı yok</b><p>Yeni kâğıtlar eklendikçe burada görünecek.</p></div>';
  }
  document.querySelectorAll('[data-grade]').forEach(c => c.addEventListener('click', () => { grade = c.dataset.grade; render(); }));
  render();
})();
</script>
</body>
</html>
