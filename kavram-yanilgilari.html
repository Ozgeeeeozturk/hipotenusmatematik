<style>
  .ky-liste{display:grid;gap:16px;margin-top:6px}
  .ky{position:relative;overflow:hidden;background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;display:grid;gap:12px;border-top:6px solid var(--c)}
  .ky-ust{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .ky-ust h3{font-family:'Baloo 2',cursive;font-size:1.25rem;line-height:1.15}
  .ky-ust .konu{display:block;font:800 .8rem 'Nunito';color:var(--muted);margin-bottom:2px}
  .ky-ikili{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ky-kutu{border-radius:14px;padding:11px 13px;line-height:1.45;font-weight:700}
  .ky-kutu b{display:block;font:800 .82rem 'Nunito';margin-bottom:3px;letter-spacing:.2px}
  .ky-yanlis{background:#FDECEF;color:#7A2335}
  .ky-yanlis b{color:#C2415B}
  .ky-dogru{background:var(--mint-light);color:#1E5E48}
  .ky-dogru b{color:var(--mint-dark)}
  .ky-kutu .ifade{font:800 1.05rem 'Baloo 2',cursive;display:block}
  .ky-neden,.ky-ipucu{font-size:.93rem;line-height:1.5;color:var(--ink)}
  .ky-neden b,.ky-ipucu b{color:var(--lilac-dark)}
  .ky-ipucu{background:var(--yellow-light);border-radius:14px;padding:10px 13px}
  .ky-alt{display:flex;justify-content:flex-end}
  .ky-alt a{font-weight:800;color:var(--lilac-dark);background:var(--lilac-light);border-radius:999px;padding:6px 14px;font-size:.88rem}
  @media (max-width:640px){.ky-ikili{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="site-header">
  <div class="bar">
    <a href="index.html" class="logo" aria-label="Hipotenüs ana sayfa">
      <svg viewBox="0 0 745 745" aria-hidden="true">
        <rect width="745" height="745" rx="168" fill="#6E58BD"/>
        <rect x="176" y="145" width="112" height="475" rx="32" fill="#fff"/>
        <rect x="461" y="145" width="112" height="475" rx="32" fill="#fff"/>
        <polygon points="461,346 461,485 322,485" fill="#8FDDC6"/>
        <rect x="404" y="435" width="57" height="50" fill="#6E58BD"/>
        <rect x="422" y="453" width="39" height="32" fill="#8FDDC6"/>
        <line x1="489" y1="277" x2="260" y2="503" stroke="#FFD453" stroke-width="74" stroke-linecap="round"/>
      </svg>
      <span>Hipoten<b>ü</b>s</span>
    </a>
    <div class="bar-actions">
      <a class="btn-login btn-ghost" href="index.html"><span aria-hidden="true">🏠</span><span class="lbl">Ana Sayfa</span></a>
      <div id="userArea"></div>
    </div>
  </div>
</header>

<main class="wrap" style="padding-bottom:48px">
  <div class="page-head">
    <div><h1>Kavram Yanılgıları</h1><p>Öğrencilerin matematikte en sık düştüğü tuzaklar: nasıl düşünüyorlar, doğrusu ne, neden böyle oluyor ve sınıfta nasıl düzeltilir?</p></div>
  </div>
  <div class="filters" role="group" aria-label="Sınıf">
    <button class="chip" data-grade="" aria-pressed="true">Tüm sınıflar</button>
    <button class="chip" data-grade="5" aria-pressed="false">5. Sınıf</button>
    <button class="chip" data-grade="6" aria-pressed="false">6. Sınıf</button>
    <button class="chip" data-grade="7" aria-pressed="false">7. Sınıf</button>
    <button class="chip" data-grade="8" aria-pressed="false">8. Sınıf</button>
  </div>
  <div class="ky-liste" id="list" aria-live="polite"></div>
</main>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="games.js"></script>
<script>
// Kavram yanılgıları: y = öğrencinin düşüncesi, d = doğrusu, n = neden olur, i = sınıfta nasıl düzeltilir
const YANILGILAR = [
  {
    s: [7], konu: 'Rasyonel Sayılar', baslik: 'Negatif kesri sayı doğrusunda yanlış uçtan saymak',
    y: '−3/4 → −1’den sağa 3 parça',
    yAc: '<p>Öğrenci 0 ile −1 arasını 4 eş parçaya doğru böler ama saymaya −1’den başlar. Üçüncü çentiğe “−3/4” yazar; oysa işaretlediği nokta aslında −1/4’tür.</p>',
    d: '−3/4 → 0’dan sola 3 parça',
    dAc: '<p>Negatif bir kesrin yeri, 0’a olan uzaklığıyla bulunur: −3/4, 0’ın 3/4 birim solundadır. Saymaya her zaman 0’dan başlanır.</p>',
    n: 'Pozitif kesirlerde sayma hep aralığın sol ucundan (0’dan) başlar. Öğrenci “soldan sağa say” alışkanlığını negatif tarafa taşır ve aralığın sol ucu olan −1’i başlangıç noktası sanır. Sayının 0’a uzaklığı yerine çentiklerin sırasına odaklanır.',
    i: '“Kurbağa kuralı”nı kurun: kurbağa her zaman 0’dan başlar, birim payda kadar eş parçaya bölünür, pay kadar <b>sola</b> zıplanır. Zemine bantla bir sayı doğrusu yapıp öğrenciyi 0’dan geriye adım attırın. 3/4 ile −3/4’ü aynı doğruda gösterip 0’a uzaklıklarının eşit olduğunu karşılaştırın. <b>Tam sayılı kesirlerde de referans 0’dır:</b> −1 4/5 için önce 0’dan 1 tam birim sola (−1’e), sonra 4/5 birim daha sola gidilir. −1’e gelip sağa saymak (−1/5) ya da −2’den sağa saymak (−1 1/5) aynı yanılgının iki biçimidir.',
    oyun: ['yanilgi-negatif-kesir.html', 'Giderme etkinliği: 0’dan Zıpla']
  }
];
(function () {
  initPage();
  const RENK = { 5: '#9EE6C9', 6: '#C8A2E8', 7: '#FFD84D', 8: '#7B4FA8' };
  let grade = new URLSearchParams(location.search).get('sinif') || '';
  const kart = k => `<article class="ky" style="--c:${RENK[k.s[0]]}">
      <div class="ky-ust"><div><span class="konu">${k.konu}</span><h3>${k.baslik}</h3></div><span class="sinif-kose"><b>${gRange(k.s)}.</b>Sınıf</span></div>
      <div class="ky-ikili">
        <div class="ky-kutu ky-yanlis"><b>✗ ÖĞRENCİ NE DÜŞÜNÜYOR?</b><span class="ifade">${k.y}</span>${k.yAc}</div>
        <div class="ky-kutu ky-dogru"><b>✓ DOĞRUSU</b><span class="ifade">${k.d}</span>${k.dAc}</div>
      </div>
      <p class="ky-neden"><b>Neden olur?</b> ${k.n}</p>
      <p class="ky-ipucu"><b>💡 Sınıfta nasıl düzeltilir?</b> ${k.i}</p>
      ${k.oyun ? `<div class="ky-alt"><a href="${k.oyun[0]}">🎲 ${k.oyun[1]} →</a></div>` : ''}
    </article>`;
  function render() {
    document.querySelectorAll('[data-grade]').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.grade === grade)));
    try { history.replaceState(null, '', grade ? `?sinif=${grade}` : location.pathname); } catch {}
    const liste = YANILGILAR.filter(k => !grade || k.s.includes(Number(grade)));
    document.getElementById('list').innerHTML = liste.length ? liste.map(kart).join('') : '<div class="empty"><b>İçerik hazırlanıyor</b><p>Kavram yanılgıları yakında burada olacak.</p></div>';
  }
  document.querySelectorAll('[data-grade]').forEach(c => c.addEventListener('click', () => { grade = c.dataset.grade; render(); }));
  render();
})();
</script>
</body>
</html>
