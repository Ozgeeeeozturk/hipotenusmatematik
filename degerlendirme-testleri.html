<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Değerlendirme Testleri | Hipotenüs</title>
<link rel="canonical" href="https://hipotenusmatematik.com/degerlendirme-testleri.html">
<meta name="description" content="Hipotenüs değerlendirme testleri: Keşif, Kavrayış, Meydan Okuma ve Zirve aşamalı, yazdırılabilir matematik testleri ve cevap anahtarları (PDF).">
<meta name="theme-color" content="#2E9E78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="games.css">
<style>
  .cevap-back .modal{max-height:calc(100dvh - 32px);overflow:auto}
  .cevap-izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .cevap-izgara section{border:2px solid var(--c);border-radius:14px;padding:10px 12px;display:grid;gap:4px}
  .cevap-izgara section b{font-family:'Baloo 2',cursive;color:var(--c);font-size:1.05rem}
  .cevap-izgara span{display:flex;justify-content:space-between;font-weight:800;border-bottom:1px dashed #E5DFF0;padding:2px 0}
  .cevap-izgara span i{font-style:normal;color:var(--muted)}
  .cevap-cozum summary{cursor:pointer;font-weight:800;color:var(--lilac-dark)}
  .cevap-cozum p{font-size:.9rem;margin-top:6px;color:var(--ink)}
  @media print{
    body > *:not(.cevap-back){display:none !important}
    .cevap-back{position:static;background:none;padding:0}
    .cevap-back .modal{max-width:none !important;max-height:none;box-shadow:none;border:0}
    .cevap-back .modal-actions{display:none}
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="bar">
    <a href="index.html" class="logo" aria-label="Hipotenüs ana sayfa">
      <svg viewBox="0 0 745 745" aria-hidden="true">
        <rect width="745" height="745" rx="168" fill="#6E58BD"/>
        <rect x="176" y="145" width="112" height="475" rx="32" fill="#fff"/>
        <rect x="461" y="145" width="112" height="475" rx="32" fill="#fff"/>
        <polygon points="461,346 461,485 322,485" fill="#8FDDC6"/>
        <rect x="404" y="435" width="57" height="50" fill="#6E58BD"/>
        <rect x="422" y="453" width="39" height="32" fill="#8FDDC6"/>
        <line x1="489" y1="277" x2="260" y2="503" stroke="#FFD453" stroke-width="74" stroke-linecap="round"/>
      </svg>
      <span>Hipoten<b>ü</b>s</span>
    </a>
    <div class="bar-actions">
      <a class="btn-login btn-ghost" href="index.html"><span aria-hidden="true">🏠</span><span class="lbl">Ana Sayfa</span></a>
      <div id="userArea"></div>
    </div>
  </div>
</header>

<main class="wrap" style="padding-bottom:48px">
  <div class="page-head">
    <div><h1>Değerlendirme Testleri</h1><p>Dört aşamalı testler: Keşif → Kavrayış → Meydan Okuma → Zirve. Cevap anahtarları yalnızca öğretmen hesabıyla görünür.</p></div>
  </div>
  <div class="filters" role="group" aria-label="Sınıf">
    <button class="chip" data-grade="" aria-pressed="true">Tüm sınıflar</button>
    <button class="chip" data-grade="5" aria-pressed="false">5. Sınıf</button>
    <button class="chip" data-grade="6" aria-pressed="false">6. Sınıf</button>
    <button class="chip" data-grade="7" aria-pressed="false">7. Sınıf</button>
    <button class="chip" data-grade="8" aria-pressed="false">8. Sınıf</button>
  </div>
  <div class="grid ws-grid" id="list" aria-live="polite"></div>
</main>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="games.js"></script>
<script>
(function () {
  initPage();
  const params = new URLSearchParams(location.search);
  let grade = params.get('sinif') || '';
  const card = w => `<article class="card ws-card ${w.color}">
      <a class="ws-thumb" href="${w.pdf}" target="_blank" rel="noopener"><img src="${w.thumb}" alt="${esc(w.title)} testinin ilk sayfası" loading="lazy" width="397" height="562"></a>
      <div class="ws-body">
        <div class="act-top"><span class="act-type">✅ Değerlendirme Testi</span><span class="sinif-kose"><b>${w.grades ? gRange(w.grades) : w.grade}.</b>Sınıf</span></div>
        <h3>${esc(w.title)}</h3>
        <p>${esc(w.text)}</p>
        <div class="act-meta"><span class="tag">${esc(w.unit)}</span><span class="tag">${w.info}</span></div>
        <div class="ws-btns">
          <a class="btn btn-yellow" href="${w.pdf}" target="_blank" rel="noopener">📄 Aç ve Yazdır</a>
          <a class="btn btn-ghost-dark" href="${w.pdf}" download>⬇ İndir</a>${w.cevapId ? `<button class="btn btn-ghost-dark" type="button" data-cevap="${w.cevapId}">${ogretmen() ? '🔑' : '🔒'} Cevap Anahtarı</button>` : ''}
        </div>
      </div>
    </article>`;
  function render() {
    document.querySelectorAll('[data-grade]').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.grade === grade)));
    try { history.replaceState(null, '', grade ? `?sinif=${grade}` : location.pathname); } catch {}
    const list = WORKSHEETS.filter(w => w.tur === 'test' && (!grade || (w.grades || [w.grade]).includes(Number(grade))));
    document.getElementById('list').innerHTML = list.length ? list.map(card).join('')
      : '<div class="empty"><b>Bu sınıf için henüz test yok</b><p>Yeni testler eklendikçe burada görünecek.</p></div>';
  }
  document.querySelectorAll('[data-grade]').forEach(c => c.addEventListener('click', () => { grade = c.dataset.grade; render(); }));
  document.getElementById('list').addEventListener('click', e => { const b = e.target.closest('[data-cevap]'); if (b) cevapAc(b.dataset.cevap, b); });
  render();
  // Oturum arkada doğrulanınca (ör. süresi dolmuşsa) kilit simgesi güncellensin
  if (Auth.ready) Auth.refresh().then(render).catch(() => {});

  // ---- Cevap anahtarı: yalnızca öğretmen hesapları (Supabase RLS: supabase/cevap-anahtarlari.sql) ----
  function ogretmen() { const u = Auth.current(); return !!(u && u.role === 'ogretmen'); }
  function pencere(ic, genis) {
    const back = document.createElement('div');
    back.className = 'modal-back cevap-back';
    back.innerHTML = `<div class="modal modal-mint" role="dialog" aria-modal="true" style="max-width:${genis ? 720 : 400}px;border-top-color:var(--lilac-dark)"><div class="modal-body">${ic}</div></div>`;
    document.body.appendChild(back);
    const close = () => { back.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    back.addEventListener('click', e => { if (e.target === back || e.target.closest('[data-kapat]')) close(); });
    return back;
  }
  async function cevapAc(id, btn) {
    if (!ogretmen()) {
      const girisli = !!Auth.current();
      pencere(`<h3>🔒 Öğretmenlere özel</h3>
        <p>${girisli ? 'Cevap anahtarları yalnızca <b>öğretmen hesaplarında</b> görünür. Şu an öğrenci hesabıyla giriş yapmışsın.' : 'Cevap anahtarını görmek için <b>öğretmen hesabınızla</b> giriş yapın.'}</p>
        <div class="modal-actions"><button class="btn btn-plain" data-kapat>Kapat</button>${girisli ? '' : '<a class="btn btn-yellow" href="giris.html" style="justify-content:center">Giriş Yap</a>'}</div>`);
      return;
    }
    btn.disabled = true;
    try {
      const { data, error } = await sb.from('cevap_anahtarlari').select('baslik,cevaplar').eq('test', id).maybeSingle();
      if (error) throw error;
      if (!data) throw new Error('bulunamadi');
      const A = data.cevaplar.asamalar;
      pencere(`<h3>🔑 ${esc(data.baslik)}</h3>
        <div class="cevap-izgara">${A.map(a => `<section style="--c:${a.renk}"><b>${esc(a.ad)}</b>${a.sorular.map(s => `<span><i>${s.no}.</i>${s.c}</span>`).join('')}</section>`).join('')}</div>
        <details class="cevap-cozum"><summary>Kısa çözümleri göster</summary>${A.flatMap(a => a.sorular).map(s => `<p><b>${s.no}. (${s.c})</b> ${esc(s.cz)}</p>`).join('')}</details>
        <div class="modal-actions"><button class="btn btn-plain" data-kapat>Kapat</button><button class="btn btn-yellow" style="justify-content:center" onclick="this.closest('.cevap-back').querySelector('details').open=true;window.print()">🖨 Yazdır</button></div>`, true);
    } catch (e) {
      toast(e && e.message === 'bulunamadi' ? 'Bu testin cevap anahtarı henüz eklenmemiş.' : 'Cevap anahtarı açılamadı, internet bağlantını kontrol et.');
    } finally { btn.disabled = false; }
  }
})();
</script>
</body>
</html>
